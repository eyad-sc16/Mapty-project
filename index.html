<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <link rel="shortcut icon" type="image/png" href="/icon.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
  <script defer src="script.js"></script>
  <title>mapty // Map your workouts</title>
</head>

<body>
  <div class="controle-box">
    <button class="reset-btn reset" data-tooltip="Reset all">Reset All</button>
  </div>
  <div class="sidebar">

    <div class="sidebar-header">
      <button class="collect-markers-btn" data-tooltip="All markers">All Markers</button>
      <img src="logo.png" alt="Logo" class="logo" />
      <button class="sidebar-toggle-btn" data-tooltip="Close sidebar">&times;</button>
    </div>

    <ul class="workouts">
      <div class="form-outer-container">
        <span class="error-message hidden">Invalid positive number</span>
        <form class="form hidden">
          <div class="form__row">
            <label class="form__label">Type</label>
            <select class="form__input form__input--type">
              <option value="running">Running</option>
              <option value="cycling">Cycling</option>
            </select>
          </div>
          <div class="form__row">
            <label class="form__label">Distance</label>
            <input class="form__input form__input--distance" placeholder="km" />
          </div>
          <div class="form__row">
            <label class="form__label">Duration</label>
            <input class="form__input form__input--duration" placeholder="min" />
          </div>
          <div class="form__row">
            <label class="form__label">Cadence</label>
            <input class="form__input form__input--cadence" placeholder="step/min" />
          </div>
          <div class="form__row form__row--hidden">
            <label class="form__label">Elev Gain</label>
            <input class="form__input form__input--elevation" placeholder="meters" />
          </div>
          <button class="form__btn">OK</button>
        </form>
      </div>

      <form class="form edit-form hidden">
        <div class="form__row">
          <label class="form__label">Distance</label>
          <input class="form__input form__input--edit-distance" placeholder="km" />
        </div>
        <div class="form__row">
          <label class="form__label">Duration</label>
          <input class="form__input form__input--edit-duration" placeholder="min" />
        </div>
        <div class="form__row">
          <label class="form__label">Cadence</label>
          <input class="form__input form__input--edit-cadence" placeholder="step/min" />
        </div>
        <div class="form__row form__row--hidden">
          <label class="form__label">Elev Gain</label>
          <input class="form__input form__input--edit-elevation" placeholder="meters" />
        </div>
        <button class="form__btn">OK</button>
      </form>
    </ul>

    <div class="sort-container" data-tooltip="Sort workouts">
      <span class="sort-label">Sort</span>
      <label class="switch">
        <input type="checkbox" id="sort-checkbox" class="sort-checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <p class="copyright">
      &copy; Copyright by
      <a class="twitter-link" target="_blank" href="https://twitter.com/jonasschmedtman">Jonas Schmedtmann</a>. Use for
      learning or your portfolio. Don't use to teach. Don't claim
      as your own.
    </p>
  </div>

  <div id="map"></div>

  <button class="open-sidebar-btn" aria-label="Open Workout List" data-tooltip="Open sidebar">
    <span>💪</span>
  </button>
</body>

</html>
